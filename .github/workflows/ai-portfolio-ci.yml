name: AI Portfolio Quality Checks
on:
  push:
    paths:
      - 'projects/**'
      - '.github/workflows/ai-portfolio-ci.yml'
  pull_request:
    paths:
      - 'projects/**'
      - '.github/workflows/ai-portfolio-ci.yml'
  workflow_dispatch:
jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        project: [evidencedesk, risklens]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r projects/${{ matrix.project }}/backend/requirements-dev.txt
      - name: Run unit and API tests
        run: python -m pytest backend/tests -q
        working-directory: projects/${{ matrix.project }}
      - name: Run ML evaluation
        run: python -m backend.evaluate
        working-directory: projects/${{ matrix.project }}
  frontend:
    strategy:
      fail-fast: false
      matrix:
        project: [evidencedesk, risklens]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend packages
        run: npm install
        working-directory: projects/${{ matrix.project }}/frontend
      - name: Compile frontend
        run: npm run build
        working-directory: projects/${{ matrix.project }}/frontend
